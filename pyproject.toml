[project]
name = "ir-system"
version = "0.1.0"
description = "PySpark positional indexing and TF-IDF vector-space retrieval system (Technology Version)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pyspark==4.0.1",
    "streamlit>=1.65.0",
]

[project.scripts]
ir-system = "ir_system.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ir_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

